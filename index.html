<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsly App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav>
        <div class="main-nav container flex">
            <a href="#" class="company-logo" onclick="reload()">
                <img src="./assets/logo.png" alt="company logo">
            </a>
            <div class="nav-links">
                <ul class="flex">
                    <li class="hover-link nav-item" id="sports" onclick="onNavItemClick(`sports`)">Sports</li>
                    <li class="hover-link nav-item" id="finance" onclick="onNavItemClick(`finance`)">Finance</li>
                    <li class="hover-link nav-item" id="politics" onclick="onNavItemClick(`politics`)">Politics</li>
                    <li class="hover-link nav-item" id="education" onclick="onNavItemClick(`education`)">Education</li>
                    <li class="hover-link nav-item" id="lifestyle" onclick="onNavItemClick(`lifestyle`)">Lifestyle</li>
                </ul>
            </div>
            <div class="search-bar flex">
                <input type="text" class="news-input" id="news-input" placeholder="e.g. Science">
                <button class="search-button" id="search-button">Search</button>
            </div>
        </div>
        <div class="container breaking-news flex">
              <h4 id="breaking-news-title">BRAKING NEWS:</h4>
              <h4 id="breaking-news-content">No headlines available</h4>
        </div>
    </nav>
    <main>
        <div class="cards-container container flex" id="cards-container">

        </div>
     
    </main>


       <template id="template-news-card">
            <div class="card">
                <div class="card-header">
                    <img id="news-img" src="https://via.placeholder.com/400x200" alt="news-image">
                </div>
                <div class="card-content">
                    <h3 id="news-title">This is title</h3>
                    <h6 class="news-source" id="news-source">End Gadget 26/08/2026</h6>
                    <p class="news-desc" id="news-desc">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Repellat corrupti animi vitae a fuga debitis odio rem delectus harum voluptate.</p>
                    <button class="summarize-button" id="summarize-button">Summarize With AI</button>
                </div>
        </div>
        </template>

        <script src="./script.js"></script>
</body>
</html>
